services:


  mysql:
    image: mysql:8.4
    container_name: mini_whatsapp_mysql
    environment:
      MYSQL_DATABASE: mini_whatsapp
      MYSQL_USER: whatsapp
      MYSQL_PASSWORD: whatsapp123
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: mini_whatsapp_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped


  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mini_whatsapp_app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SQLALCHEMY_DATABASE_URI: mysql://whatsapp:whatsapp123@mysql:3306/mini_whatsapp
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change_me_in_production}
    ports:
      - "5000:5000"
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
